==<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    
    <title>FBHY</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
    <style>
        :root{--accent:#7bc5e4;--bg:#fff;--alt:#f6f6f7;--soft:#f1f1f4;--text:#3c3c43;--dim:#67676c;--line:#e2e2e3;--brand:color-mix(in srgb,var(--accent) 55%,#000);--on:#fff;--tip:#e7f3ee;
        --f:'Inter',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace;--red:#d1425a;color-scheme:light}
        [data-theme=dark]{--bg:#1b1b1f;--alt:#161618;--soft:#202127;--text:#dfdfd6;--dim:#98989f;--line:#2e2e32;--brand:var(--accent);--on:#10222b;--tip:#1c2a25;color-scheme:dark}
        [data-theme=amoled]{--bg:#000;--alt:#000;--soft:#0c0c0e;--text:#e4e4e0;--dim:#9a9aa2;--line:#222226;--brand:var(--accent);--on:#10222b;--tip:#0b1a14;color-scheme:dark}
        *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
        body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 var(--f);-webkit-font-smoothing:antialiased}
        button{font:inherit;color:inherit}
        #nav{position:sticky;top:0;z-index:40;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 20px 0;display:flex;align-items:center;gap:14px;background:var(--bg);border-bottom:1px solid var(--line)}
        .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--text);text-decoration:none}
        .lg{width:26px;height:26px;border-radius:7px;background:var(--brand);color:var(--on);display:grid;place-items:center;font:700 14px var(--m)}
        .sp{flex:1}
        .ib{background:none;border:0;cursor:pointer;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--dim)}.ib:hover{color:var(--brand);background:var(--soft)}
        #burger{display:none}
        .sbtn{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 10px 6px 12px;cursor:pointer;color:var(--dim);font-size:14px;min-width:min(200px,40vw)}
        .sbtn:hover{border-color:var(--brand)}.sbtn span{flex:1;text-align:left}
        kbd{font:12px var(--m);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--bg);color:var(--dim)}
        .menu{position:relative}
        #tm{position:absolute;right:0;top:44px;width:250px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
        #tm[hidden]{display:none}#tm h4{margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:600}
        #tm .md{display:flex;gap:6px;margin-bottom:14px}#tm .md button{flex:1;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px;cursor:pointer;font-size:13px}
        #tm .md button.on{border-color:var(--brand);color:var(--brand)}
        #tm .sw{display:flex;gap:8px;flex-wrap:wrap}#tm .sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--c)}#tm .sw button.on{border-color:var(--text)}
        #shell{display:grid;grid-template-columns:272px minmax(0,1fr)}
        #side{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px);overflow:auto;background:var(--alt);border-right:1px solid var(--line);padding:24px 20px 40px 28px}
        #side h4{margin:22px 0 6px;font:700 14px var(--f);color:var(--text)}#side h4:first-child{margin-top:0}
        #side a{display:flex;justify-content:space-between;padding:5px 10px;margin:0 -10px;border-radius:7px;color:var(--dim);text-decoration:none;font-size:14.5px;font-weight:500}
        #side a:hover{color:var(--text)}#side a.on{color:var(--brand);background:var(--soft)}#side a i{font:12px var(--m);font-style:normal;opacity:.7}
        main{padding:36px clamp(18px,4vw,56px) 70px;min-width:0;animation:in .35s ease both}@keyframes in{from{opacity:0}}
        .page{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:48px;max-width:1080px;margin:0 auto}
        .outline{position:sticky;top:90px;align-self:start;font-size:13px;border-left:1px solid var(--line);padding-left:14px}
        .outline b{display:block;margin-bottom:8px}.outline a{display:block;color:var(--dim);text-decoration:none;padding:2px 0}.outline a:hover{color:var(--brand)}
        h1,h2,h3{line-height:1.25;margin:0}
        .doc h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
        .doc h2{font-size:22px;font-weight:600;margin:42px 0 14px;padding-top:24px;border-top:1px solid var(--line);letter-spacing:-.01em}
        .lead{color:var(--dim);margin:0 0 22px}
        .hero{display:grid;grid-template-columns:1fr minmax(0,320px);align-items:center;gap:40px;max-width:1080px;margin:0 auto;padding:40px 0 30px}
        .hero h1{font-size:clamp(40px,7vw,68px);font-weight:700;letter-spacing:-.04em;color:var(--brand);line-height:1.05}
        .hero .tg{font-size:clamp(19px,2.4vw,24px);color:var(--text);margin:14px 0 4px;max-width:30ch;line-height:1.4;font-weight:500}
        .hero .ab{color:var(--dim);margin:0 0 26px}
        .acts{display:flex;gap:12px;flex-wrap:wrap}
        .b{font:600 15px var(--f);padding:9px 22px;border-radius:999px;border:1px solid transparent;text-decoration:none;cursor:pointer;display:inline-block}
        .b.brand{background:var(--brand);color:var(--on)}.b.brand:hover{filter:brightness(1.1)}
        .b.alt{background:var(--soft);color:var(--text);border-color:var(--line)}.b.alt:hover{border-color:var(--brand)}
        .hi{position:relative;display:grid;place-items:center}.hi::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:var(--accent);filter:blur(70px);opacity:.3}
        .hi svg{position:relative;width:min(240px,70%)}
        .pill{display:inline-block;font-size:13px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 14px;margin-bottom:18px;color:var(--dim);text-decoration:none}.pill:hover{color:var(--brand);border-color:var(--brand)}
        .sm{max-width:1080px;margin:12px auto 14px;color:var(--dim);font-size:14px;font-weight:600}
        .feat{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
        .fc{display:block;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:20px;text-decoration:none;color:var(--text);transition:border-color .2s}
        .fc:hover{border-color:var(--brand)}.fc b{display:block;font-size:17px;margin-bottom:4px}.fc p{margin:0;color:var(--dim);font-size:14.5px;line-height:1.55}.fc em{display:inline-block;font:600 12px var(--m);color:var(--brand);font-style:normal;margin-top:12px}
        .rec{max-width:1080px;margin:0 auto}.rec h2{font-size:22px;margin:44px 0 14px;padding-top:24px;border-top:1px solid var(--line)}
        .list{display:flex;flex-direction:column}
        .it{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.5fr) auto auto;gap:6px 16px;align-items:baseline;padding:10px 6px;border-bottom:1px solid var(--line)}
        .it:hover{background:var(--soft)}
        .it .t{font-weight:600;color:var(--brand);text-decoration:none}.it .t:hover{text-decoration:underline}
        .it .d{color:var(--dim);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .tag{font:600 11.5px var(--m);border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--dim)}
        .q{font:600 13px var(--f);color:var(--brand);text-decoration:none;border:1px solid var(--brand);border-radius:999px;padding:1px 12px}.q:hover{background:var(--brand);color:var(--on)}.q.off{border-color:var(--line);color:var(--dim)}
        .tools{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;margin:18px 0 10px}
        .tools input,.f input,.f select,.f textarea{font:15px var(--f);color:var(--text);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:0;width:100%}
        .tools input:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand)}.tools input{max-width:360px}
        .chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:14px;color:var(--dim)}
        .chips button.on,.chips button:hover{border-color:var(--brand);color:var(--brand)}
        .note{color:var(--dim);font-size:14px;margin:6px 0 12px}
        .blk{border-radius:8px;padding:14px 18px;background:var(--tip);border-left:4px solid var(--brand);margin:18px 0}.blk b{display:block;margin-bottom:2px}.blk p{margin:0;color:var(--dim)}
        .empty{border-radius:8px;padding:18px 22px;background:var(--soft);border-left:4px solid #e2a93b;max-width:640px}.empty h3{font-size:17px;margin-bottom:4px}.empty p{margin:0 0 6px;color:var(--dim)}
        .more{margin:26px 0}.more button,.btn{font:600 14px var(--f);background:var(--soft);color:var(--text);border:1px solid var(--line);padding:8px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
        .more button:hover,.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.red{color:var(--red)}.btn.red:hover{border-color:var(--red)}
        .bk{display:grid;grid-template-columns:150px 1fr;gap:28px;align-items:start;margin:14px 0 6px}
        .cover{width:150px;aspect-ratio:3/4.2;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
        .cover.ph{background:var(--soft);display:grid;place-items:center;padding:12px;font:600 13px/1.3 var(--m);color:var(--brand);text-align:center;border-left:6px solid var(--brand)}
        table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--line);padding:8px 14px;text-align:left}tr:nth-child(2n) td{background:var(--soft)}td:first-child{color:var(--dim);width:9em;font-weight:600}
        .ed{display:flex;flex-wrap:wrap;gap:10px}
        .crumb{font-size:13.5px;color:var(--dim);margin-bottom:14px}.crumb a{color:var(--dim);text-decoration:none}.crumb a:hover{color:var(--brand)}
        .f{display:grid;gap:16px;max-width:680px}.f label{font:600 13px var(--f);color:var(--dim);display:block;margin-bottom:4px}
        .f .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.f textarea{min-height:90px;resize:vertical}.f input[type=checkbox]{width:auto}.f input[type=file]{padding:7px}
        .ledger{margin-top:34px}.led{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:center}
        .led small{display:block;color:var(--dim);font-size:13px}.led div:last-child{display:flex;gap:6px;flex-wrap:wrap}.led .btn{padding:4px 10px;font-size:13px}
        #toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 30px;background:var(--text);color:var(--bg);font:500 14px var(--f);padding:11px 20px;border-radius:10px;z-index:90;opacity:0;transition:.3s;max-width:92vw;pointer-events:none}
        #toast.on{opacity:1;translate:-50% 0}#toast.err{background:var(--red);color:#fff}
        .load{padding:20vh 20px;text-align:center;color:var(--dim)}
        #sv{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;justify-content:center;align-items:flex-start;padding:12vh 16px}#sv.on{display:flex}
        #sb{width:min(600px,100%);background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden}
        #si{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);font:17px var(--f);padding:16px 18px;outline:0}
        #sr{max-height:52vh;overflow:auto;padding:8px;margin:0;list-style:none}
        #sr a{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none}
        #sr a.on,#sr a:hover{background:var(--soft);color:var(--brand)}#sr small{color:var(--dim);font-family:var(--m)}#sr li.n{padding:18px;color:var(--dim)}
        footer{border-top:1px solid var(--line);padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--dim);font-size:14px}
        @media(max-width:1180px){.page{grid-template-columns:minmax(0,1fr)}.outline{display:none}}
        @media(max-width:960px){#shell{grid-template-columns:1fr}#burger{display:grid}#side{position:fixed;left:0;top:calc(56px + env(safe-area-inset-top,0px));bottom:0;width:280px;z-index:35;translate:-100%;transition:translate .25s;height:auto}#side.open{translate:0}.hero{grid-template-columns:1fr}.hi{order:-1;max-height:150px}}
        @media(max-width:640px){.it{grid-template-columns:1fr auto}.it .d{grid-column:1/-1;order:3}.it .tag{display:none}.bk{grid-template-columns:1fr}.f .row{grid-template-columns:1fr}.sbtn kbd{display:none}}
        @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
</head>

<body>
    <header id="nav">
        <button class="ib" id="burger" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
        </button>
        <a class="logo" href="#/"><span class="lg">J</span>Freebooks Hell Yeah</a>
        <div class="sp"></div>
        <button class="sbtn" id="sbtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
            </svg><span>Search</span><kbd id="kbd">Ctrl K</kbd></button>
        <div class="menu">
            <button class="ib" id="tbtn" aria-label="Appearance">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" />
                </svg>
            </button>
            <div id="tm" hidden>
                <h4>Appearance</h4>
                <div class="md">
                    <button data-m="light">Light</button>
                    <button data-m="dark">Dark</button>
                    <button data-m="amoled">AMOLED</button>
                </div>
                <h4>Colour</h4>
                <div class="sw" id="sw"></div>
            </div>
        </div>
    </header>
    <div id="shell">
        <aside id="side" aria-label="Sections"></aside>
        <main id="app">
            <div class="load">Loading the library…</div>
        </main>
    </div>
    <footer>Every book here is free to download. No account, no sign-up.</footer>
    <div id="sv" role="dialog" aria-modal="true" aria-label="Search">
        <div id="sb">
            <input id="si" placeholder="Search books, authors, topics" autocomplete="off">
            <ul id="sr"></ul>
        </div>
    </div>
    <div id="toast" role="status"></div>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script>
        const $=s=>document.querySelector(s),app=$("#app");
        const HALLS={Physics:["Physics","Mechanics, waves, electricity, optics and modern physics."],Chemistry:["Chemistry","Physical, organic and inorganic chemistry."],Mathematics:["Mathematics","Algebra, calculus, coordinate geometry and more."]};
        const SUBJ=Object.keys(HALLS);
        let BOOKS=[],ERR=null,PAGE=24,admin=null;
        const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
        const subj=b=>SUBJ.includes(b.subject)?b.subject:"Other";
        const call=(b,i)=>(subj(b).slice(0,3).toUpperCase())+"-"+String(i+1).padStart(3,"0");
        const live=()=>BOOKS.filter(b=>b.published!==false);
        function toast(m,err){const t=$("#toast");t.textContent=m;t.className="on"+(err?" err":"");clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",4200)}
        function cover(b){return b.cover?`<img class="cover" src="${esc(b.cover)}" alt="Cover of ${esc(b.title)}">`:`<div class="cover ph"><span>${esc(b.title)}</span></div>`}
        function row(b){const f=(b.editions||[]).find(e=>e&&e.file);return `<div class="it"><a class="t" href="#/book/${encodeURIComponent(b.id)}">${esc(b.title)}</a><span class="d">${esc([b.author,b.category].filter(Boolean).join(" · ")||b.description||"")}</span><span class="tag">${esc(b.subject||"")}</span>${f?`<a class="q" href="${esc(f.file)}" rel="noopener">Download</a>`:`<span class="q off">Soon</span>`}</div>`}
        const byNew=(a,b)=>String(b.added).localeCompare(String(a.added));
        async function load(){
          try{const r=await fetch("books.yaml?"+Date.now());if(!r.ok)throw new Error("books.yaml returned "+r.status);
            const d=jsyaml.load(await r.text());BOOKS=((d&&d.books)||[]).filter(b=>b&&b.title).map((b,i)=>({...b,id:String(b.id||("book-"+i))}));ERR=null}
          catch(e){ERR=e.message==="Failed to fetch"?"Couldn’t read books.yaml. Open this site through a web server, not by double-clicking the file.":e.message}
        }
        /* ---------- views ---------- */
        const BOOKSVG=`<svg viewBox="0 0 200 200" fill="none" aria-hidden="true"><rect x="30" y="128" width="140" height="28" rx="4" fill="var(--brand)"/><rect x="42" y="96" width="120" height="28" rx="4" fill="var(--brand)" opacity=".7"/><rect x="26" y="64" width="128" height="28" rx="4" fill="var(--brand)" opacity=".45"/><path d="M56 140h46M66 108h50M48 76h40" stroke="var(--bg)" stroke-width="5" stroke-linecap="round"/></svg>`;
        function home(){
          const L=live(),recent=[...L].sort(byNew).slice(0,8);
          return `<section class="hero"><div><a class="pill" href="${recent[0]?"#/book/"+encodeURIComponent(recent[0].id):"#/stacks"}">${recent[0]?"Latest: "+esc(recent[0].title):"Library opening soon"}</a><h1>Freebooks Hell Yeah!</h1><p class="tg">Free books for JEE Physics, Chemistry and Mathematics.</p><p class="ab">${L.length} ${L.length==1?"book":"books"} so far. Download any of them, no account needed.</p>
          <div class="acts"><a class="b brand" href="#/stacks">Browse all books</a><a class="b alt" href="#/stacks?s=Physics">Start with Physics</a><button class="b alt" id="hs">Search</button></div></div><div class="hi">${BOOKSVG}</div></section>
          <p class="sm">Or browse these pages</p>
          <div class="feat">${SUBJ.map(s=>{const c=L.filter(b=>b.subject===s).length;return `<a class="fc" href="#/stacks?s=${s}"><b>${HALLS[s][0]}</b><p>${HALLS[s][1]}</p><em>${c} ${c==1?"book":"books"}</em></a>`}).join("")}</div>
          <div class="rec"><h2>Recently added</h2>${recent.length?`<div class="list">${recent.map(row).join("")}</div>`:`<div class="empty"><h3>No books yet</h3><p>${ERR?esc(ERR):"Books will show up here as soon as they are added."}</p></div>`}</div>`}
        function stacks(q){
          const s=q.get("s")||"",t=(q.get("q")||"").trim().toLowerCase();
          const L=live().filter(b=>(!s||b.subject===s)&&(!t||[b.title,b.author,b.publisher,b.category,b.description].join(" ").toLowerCase().includes(t))).sort(byNew);
          const shown=L.slice(0,PAGE),g={};shown.forEach(b=>(g[b.category||"Other"]=g[b.category||"Other"]||[]).push(b));
          const cats=Object.keys(g).sort(),slug=c=>"c-"+c.toLowerCase().replace(/[^a-z0-9]+/g,"-");
          const body=!shown.length?`<div class="empty"><h3>${ERR?"Couldn’t load the library":(live().length?"Nothing matches that":"This section is empty")}</h3><p>${ERR?esc(ERR):(live().length?"Try fewer words or pick another subject.":"Books will appear here as soon as they are published.")}</p></div>`
           :cats.map(c=>`<h2 id="${slug(c)}">${esc(c)}</h2><div class="list">${g[c].map(row).join("")}</div>`).join("");
          return `<div class="page"><div class="doc"><h1>${s?HALLS[s][0]:"All books"}</h1><p class="lead">${s?HALLS[s][1]:"Every published book, newest first within each category."}</p>
          <div class="tools"><input id="q" type="search" placeholder="Filter this list" value="${esc(q.get("q")||"")}" autocomplete="off"><div class="chips"><button data-s="" class="${s?"":"on"}">All</button>${SUBJ.map(x=>`<button data-s="${x}" class="${s==x?"on":""}">${x}</button>`).join("")}</div></div>
          <p class="note">${L.length} ${L.length==1?"book":"books"}${t?" matching “"+esc(t)+"”":""}</p>${body}
          ${L.length>PAGE?`<div class="more"><button id="more">Show more (${L.length-PAGE} left)</button></div>`:""}</div>
          <nav class="outline"><b>On this page</b>${cats.map(c=>`<a href="#" data-go="${slug(c)}">${esc(c)}</a>`).join("")}</nav></div>`}
        function bookPage(id){
          const i=BOOKS.findIndex(b=>b.id===id),b=BOOKS[i];
          if(!b||(b.published===false&&!admin))return `<div class="doc" style="max-width:760px;margin:0 auto"><h1>Book not found</h1><p class="lead">It may have been removed, or the link is wrong.</p><a class="btn" href="#/stacks">Back to all books</a></div>`;
          const eds=(b.editions||[]).filter(e=>e&&e.file),more=live().filter(x=>x.subject===b.subject&&x.id!==b.id).slice(0,6);
          const r=(k,v)=>v?`<tr><td>${k}</td><td>${esc(v)}</td></tr>`:"";
          return `<div class="page"><div class="doc"><div class="crumb"><a href="#/stacks">Library</a> / <a href="#/stacks${b.subject?"?s="+b.subject:""}">${esc(b.subject||"Books")}</a></div>
          <div class="bk">${cover(b)}<div><h1>${esc(b.title)}</h1><p class="lead">${esc([b.author,b.publisher].filter(Boolean).join(" · "))}</p>${b.published===false?`<div class="blk"><b>Unpublished</b><p>Only you can see this book.</p></div>`:`<div class="blk"><b>Free to download</b><p>No account, no sign-up.</p></div>`}</div></div>
          <h2 id="details">Details</h2><table>${r("Author",b.author)}${r("Publisher",b.publisher)}${r("Subject",b.subject)}${r("Category",b.category)}${r("Added",b.added)}${r("Reference",call(b,i))}</table>
          <h2 id="download">Download</h2><div class="ed">${eds.length?eds.map(e=>`<a class="b brand dlb" href="${esc(e.file)}" rel="noopener">Download ${esc(e.name||"book")}</a>`).join(""):`<span class="note">The file hasn’t been added yet.</span>`}</div>
          ${b.description?`<h2 id="about">About this book</h2><p>${esc(b.description)}</p>`:""}
          ${more.length?`<h2 id="more">More in ${esc(b.subject)}</h2><div class="list">${more.map(row).join("")}</div>`:""}</div>
          <nav class="outline"><b>On this page</b><a href="#" data-go="details">Details</a><a href="#" data-go="download">Download</a>${b.description?`<a href="#" data-go="about">About</a>`:""}${more.length?`<a href="#" data-go="more">More in ${esc(b.subject)}</a>`:""}</nav></div>`}
        /* ---------- keeper (admin) ---------- */
        const gh=async(m,p,body)=>{const c=admin;const r=await fetch(`https://api.github.com/repos/${c.repo}/contents/${p}${m==="GET"?"?ref="+c.branch+"&t="+Date.now():""}`,{method:m,headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"},body:body?JSON.stringify({branch:c.branch,...body}):undefined});
          if(m==="GET"&&r.status===404)return null;if(!r.ok)throw new Error((await r.json().catch(()=>({}))).message||("GitHub said "+r.status));return r.json()};
        const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f)});
        const u8=s=>btoa(unescape(encodeURIComponent(s)));
        async function putFile(path,b64data,msg){const ex=await gh("GET",path);await gh("PUT",path,{message:msg,content:b64data,sha:ex?.sha})}
        async function mutate(fn,msg){const cur=await gh("GET","books.yaml");let d={books:[]};
          if(cur)d=jsyaml.load(decodeURIComponent(escape(atob(cur.content.replace(/\n/g,"")))))||{books:[]};
          d.books=d.books||[];fn(d.books);
          const head="# The Night Stacks library. Managed from the Keeper’s Door.\n";
          await gh("PUT","books.yaml",{message:msg,content:u8(head+jsyaml.dump(d,{lineWidth:-1})),sha:cur?.sha});BOOKS=d.books.filter(b=>b&&b.title).map(b=>({...b,id:String(b.id)}))}
        function keeper(){
          if(!admin){const s=JSON.parse(sessionStorage.getItem("keeper")||"{}");
            return `<div class="doc" style="max-width:760px;margin:0 auto"><h1>Admin</h1><p class="note" style="max-width:60ch">Only the keeper has the key. This site lives on GitHub Pages, so the key is a GitHub access token for your repository. It stays in this browser tab and is never sent anywhere except GitHub.</p>
            <form class="f" id="kf"><div class="row"><div><label>Repository (owner/name)</label><input name="repo" required placeholder="you/jee-library" value="${esc(s.repo||"")}"></div><div><label>Branch</label><input name="branch" value="${esc(s.branch||"main")}"></div></div>
            <div><label>Fine-grained token (Contents: read &amp; write on that repo only)</label><input name="token" type="password" required autocomplete="off"></div>
            <div><button class="btn" id="unlock">Unlock</button></div></form>
            <p class="note" style="margin-top:34px;max-width:60ch">Not on GitHub? You can still edit <b>books.yaml</b> by hand and upload your files anywhere. The format is documented at the top of that file.</p></div>`}
          const rows=BOOKS.map((b,i)=>`<div class="led"><div>${esc(b.title)}<small>${call(b,i)} · ${esc(b.subject||"no hall")} · ${b.published===false?"unpublished":"published"}</small></div><div>
          <button class="btn" data-a="edit" data-i="${i}">Edit</button><button class="btn" data-a="pub" data-i="${i}">${b.published===false?"Publish":"Unpublish"}</button><button class="btn red" data-a="del" data-i="${i}">Delete</button></div></div>`).join("");
          return `<div class="doc" style="max-width:760px;margin:0 auto"><h2>Add or edit a book</h2><p class="note">Signed in to ${esc(admin.repo)}. Changes go live once GitHub Pages rebuilds (usually under a minute).</p>
          <form class="f" id="bf"><input type="hidden" name="id">
          <div><label>Title</label><input name="title" required></div>
          <div class="row"><div><label>Author</label><input name="author"></div><div><label>Publisher</label><input name="publisher"></div></div>
          <div class="row"><div><label>Hall</label><select name="subject">${SUBJ.map(s=>`<option>${s}</option>`).join("")}</select></div><div><label>Category (e.g. Mechanics, Organic)</label><input name="category"></div></div>
          <div><label>Description</label><textarea name="description"></textarea></div>
          <div class="row"><div><label>Uploadables.io file link</label><input type="url" name="filelink" placeholder="https://uploadables.io/..." required></div><div><label>Edition name</label><input name="edname" placeholder="e.g. PDF"></div></div>
          <p class="note">Upload the PDF to Uploadables.io first, then paste its share/download link here. Visitors will be redirected to that link.</p>
          <div><label>Cover image (optional, JPG or PNG)</label><input type="file" name="cov" accept="image/*"></div>
          <label><input type="checkbox" name="published" checked> Published (visible to everyone)</label>
          <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="save">Save book</button><button type="button" class="btn" id="reset">Clear form</button></div></form>
          <div class="ledger"><h3 style="margin:34px 0 8px">The ledger (${BOOKS.length})</h3>${rows||`<p class="note">Nothing shelved yet.</p>`}
          <p style="margin-top:28px;display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="exp">Download books.yaml</button><button class="btn" id="lock">Sign out</button></p></div></div>`}
        function keeperEvents(){
          const kf=$("#kf");if(kf)kf.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(kf));$("#unlock").textContent="Checking…";
            admin={repo:f.repo.trim(),branch:f.branch.trim()||"main",token:f.token.trim()};
            try{const r=await fetch("https://api.github.com/repos/"+admin.repo,{headers:{Authorization:"Bearer "+admin.token}});
              if(!r.ok)throw new Error(r.status===404||r.status===401?"That token can’t open this repository.":"GitHub said "+r.status);
              if(r.status===200&&(await r.json()).permissions&&!(await Promise.resolve(true)))0;
              sessionStorage.setItem("keeper",JSON.stringify({repo:admin.repo,branch:admin.branch}));toast("Signed in.");render()}
            catch(x){admin=null;toast(x.message,1);$("#unlock").textContent="Unlock"}};
          const bf=$("#bf");if(!bf)return;
          const fill=i=>{const b=BOOKS[i];for(const k of["id","title","author","publisher","subject","category","description"])bf.elements[k].value=b[k]||"";
            bf.elements.published.checked=b.published!==false;bf.elements.edname.value=b.editions?.[0]?.name||"";bf.elements.filelink.value=b.editions?.[0]?.file||"";scrollTo({top:0,behavior:"smooth"})};
          $("#reset").onclick=()=>{bf.reset();bf.elements.id.value=""};
          $("#lock").onclick=()=>{admin=null;render();toast("Signed out.")};
          $("#exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([jsyaml.dump({books:BOOKS},{lineWidth:-1})],{type:"text/yaml"}));a.download="books.yaml";a.click()};
          document.querySelectorAll(".led .btn").forEach(btn=>btn.onclick=async()=>{const i=+btn.dataset.i,b=BOOKS[i],a=btn.dataset.a;
            if(a==="edit")return fill(i);
            try{if(a==="pub"){await mutate(L=>{const x=L.find(y=>String(y.id)===b.id);x.published=b.published===false},"Toggle "+b.id);toast(b.published===false?"Unpublished.":"Published.")}
              if(a==="del"){if(!confirm("Delete “"+b.title+"” and its files? This can’t be undone."))return;
                for(const f of[...(b.editions||[]).map(e=>e.file),b.cover]){if(f&&!/^https?:/.test(f)){const ex=await gh("GET",f);if(ex)await gh("DELETE",f,{message:"Remove "+f,sha:ex.sha})}}
                await mutate(L=>{const k=L.findIndex(y=>String(y.id)===b.id);if(k>-1)L.splice(k,1)},"Delete "+b.id);toast("Deleted.")}
              render()}catch(x){toast(x.message,1)}});
          bf.onsubmit=async e=>{e.preventDefault();const f=bf.elements,sv=$("#save");sv.disabled=true;sv.textContent="Saving…";
            try{const title=f.title.value.trim();let id=f.id.value||title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"book-"+Date.now();
              const old=BOOKS.find(b=>b.id===id),entry={id,title,author:f.author.value.trim()||undefined,publisher:f.publisher.value.trim()||undefined,subject:f.subject.value,category:f.category.value.trim()||undefined,
                description:f.description.value.trim()||undefined,cover:old?.cover,added:old?.added||new Date().toISOString().slice(0,10),published:f.published.checked,editions:old?.editions||[]};
              const filelink=f.filelink.value.trim(),cov=f.cov.files[0];
              if(filelink){
                let parsed;
                try{parsed=new URL(filelink)}catch(_){throw new Error("Enter a valid Uploadables.io link.")}
                if(parsed.protocol!=="https:"||parsed.hostname!=="uploadables.io"&&!parsed.hostname.endsWith(".uploadables.io"))throw new Error("Please enter an HTTPS Uploadables.io link.");
                entry.editions=[{name:f.edname.value.trim()||"PDF",file:parsed.href}];
              }else if(entry.editions[0]&&f.edname.value.trim())entry.editions[0].name=f.edname.value.trim();
              if(cov){const p="covers/"+id+"."+(cov.name.split(".").pop()||"jpg");await putFile(p,await b64(cov),"Upload "+p);entry.cover=p}
              await mutate(L=>{const k=L.findIndex(y=>String(y.id)===id);k>-1?L[k]=entry:L.unshift(entry)},(old?"Edit ":"Add ")+id);
              toast("Saved. It appears publicly once the site rebuilds.");render()}
            catch(x){toast(x.message,1);sv.disabled=false;sv.textContent="Save book"}}}
        /* ---------- router ---------- */
        const SIDE=()=>{const L=live(),c=s=>L.filter(b=>b.subject===s).length,k=h=>{const[p,qs]=h.slice(1).split("?"),x=new URLSearchParams(qs||"").get("s");return p+(x?"?s="+x:"")},cur=k(location.hash||"#/");
          const it=(n,h,c)=>`<a href="${h}" class="${k(h)===cur?"on":""}">${n}${c!=null?`<i>${c}</i>`:""}</a>`;
          return `<h4>Library</h4>${it("Home","#/")}${it("All books","#/stacks",L.length)}<h4>Subjects</h4>${SUBJ.map(s=>it(s,"#/stacks?s="+s,c(s))).join("")}<h4>Owner</h4>${it("Admin","#/keeper")}`};
        function render(){
          const h=location.hash.slice(1)||"/",[path,qs]=h.split("?"),q=new URLSearchParams(qs||""),seg=path.split("/");
          let html;
          if(seg[1]==="stacks")html=stacks(q);else if(seg[1]==="book")html=bookPage(decodeURIComponent(seg[2]||""));else if(seg[1]==="keeper")html=keeper();else html=home();
          app.style.animation="none";app.offsetWidth;app.style.animation="";app.innerHTML=html;
          $("#side").innerHTML=SIDE();$("#side").classList.remove("open");
          if(seg[1]==="stacks"){const qi=$("#q");let tm;
            qi.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{PAGE=60;q.set("q",qi.value);history.replaceState(null,"","#/stacks?"+q);const c=qi.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(c,c)},220)};
            document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{PAGE=60;b.dataset.s?q.set("s",b.dataset.s):q.delete("s");location.hash="#/stacks?"+q});
            const m=$("#more");if(m)m.onclick=()=>{PAGE+=60;render()}}
          document.querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.go)?.scrollIntoView({behavior:"smooth"})});
          document.querySelectorAll(".dlb,.q:not(.off)").forEach(a=>a.addEventListener("click",()=>toast("Opening the download link…")));
          const hs=$("#hs");if(hs)hs.onclick=openS;
          keeperEvents();
          if(seg[1]!=="stacks"||!qs)scrollTo(0,0)
        }
        let sel=0,res=[];
        function openS(){$("#sv").classList.add("on");const i=$("#si");i.value="";fillS();i.focus()}
        function closeS(){$("#sv").classList.remove("on")}
        function fillS(){const t=$("#si").value.trim().toLowerCase();
          res=live().filter(b=>!t||[b.title,b.author,b.publisher,b.category,b.subject,b.description].join(" ").toLowerCase().includes(t)).sort(byNew).slice(0,12);sel=0;paintS()}
        function paintS(){$("#sr").innerHTML=res.length?res.map((b,i)=>`<li><a href="#/book/${encodeURIComponent(b.id)}" class="${i==sel?"on":""}">${esc(b.title)}<small>${esc(b.subject||"")}</small></a></li>`).join(""):`<li class="n">${live().length?"No books match that.":"No books yet."}</li>`}
        $("#sbtn").onclick=openS;$("#si").oninput=fillS;$("#sv").onclick=e=>{if(e.target.id==="sv")closeS()};
        $("#sr").onclick=e=>{if(e.target.closest("a"))closeS()};
        addEventListener("keydown",e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
          if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openS()}
          else if(e.key==="/"&&!typing){e.preventDefault();openS()}
          else if($("#sv").classList.contains("on")){if(e.key==="Escape")closeS();
            else if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(res.length-1,sel+1);paintS()}
            else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);paintS()}
            else if(e.key==="Enter"&&res[sel]){location.hash="#/book/"+encodeURIComponent(res[sel].id);closeS()}}});
        $("#kbd").textContent=/Mac|iPhone|iPad/.test(navigator.platform)?"⌘ K":"Ctrl K";
        const ACC={Sky:"#7bc5e4",Rose:"#f0a1c0",Mint:"#8fd6a6",Lilac:"#b7a4f4",Amber:"#f3c26b"};
        let TH={};try{TH=JSON.parse(localStorage.getItem("fj")||"{}")}catch(e){}
        function theme(){const m=TH.m||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),a=ACC[TH.a]||ACC.Sky;
          document.documentElement.dataset.theme=m;document.documentElement.style.setProperty("--accent",a);
          document.querySelectorAll("#tm .md button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
          document.querySelectorAll("#sw button").forEach(b=>b.classList.toggle("on",b.title===(TH.a||"Sky")));
          try{localStorage.setItem("fj",JSON.stringify(TH))}catch(e){}}
        $("#sw").innerHTML=Object.entries(ACC).map(([n,c])=>`<button title="${n}" aria-label="${n}" style="--c:${c}"></button>`).join("");
        document.querySelectorAll("#sw button").forEach(b=>b.onclick=()=>{TH.a=b.title;theme()});
        document.querySelectorAll("#tm .md button").forEach(b=>b.onclick=()=>{TH.m=b.dataset.m;theme()});
        $("#tbtn").onclick=e=>{e.stopPropagation();$("#tm").hidden=!$("#tm").hidden};
        addEventListener("click",e=>{if(!e.target.closest(".menu"))$("#tm").hidden=true});
        $("#burger").onclick=()=>$("#side").classList.toggle("open");
        theme();
        addEventListener("hashchange",render);
        load().then(render);
    </script>
</body>

</html>
