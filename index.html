<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FBHY · Freebooks Hell Yeah</title>
  <meta name="description" content="Free JEE books for Physics, Chemistry and Mathematics. Download any of them, no sign-up.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237bc5e4'/%3E%3Crect x='10' y='16' width='38' height='9' rx='2' fill='%2310222b' opacity='.75'/%3E%3Crect x='16' y='28' width='34' height='9' rx='2' fill='%2310222b' opacity='.9'/%3E%3Crect x='12' y='40' width='40' height='9' rx='2' fill='%2310222b'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#7bc5e4">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Freebooks Hell Yeah">
  <meta property="og:title" content="Freebooks Hell Yeah, free JEE books">
  <meta property="og:description" content="Physics, Chemistry and Mathematics books for JEE. Free to download, no sign-up.">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="nav">
    <button class="ib" id="burger" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
    <a class="logo" href="#/"><span class="lg">J</span>Freebooks Hell Yeah</a>
    <div class="sp"></div>
    <button class="sbtn" id="sbtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <span>Search</span>
      <kbd id="kbd">Ctrl K</kbd>
    </button>
    <div class="menu">
      <button class="ib" id="tbtn" aria-label="Appearance">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
        </svg>
      </button>
      <div id="tm" hidden>
        <h4>Appearance</h4>
        <div class="md">
          <button data-m="light">Light</button>
          <button data-m="dark">Dark</button>
          <button data-m="amoled">AMOLED</button>
        </div>
        <h4>Colour</h4>
        <div class="sw" id="sw"></div>
      </div>
    </div>
  </header>

  <div id="shell">
    <aside id="side" aria-label="Sections"></aside>
    <main id="app"><div class="load">Loading the library…</div></main>
  </div>

  <footer>
    🎁 Every book here is free to download. No account, no sign-up.


    I usually verify every file before uploading. Made and run by NSS.

    
    In case you want a book to be uploaded, you can DM on discord at fancybear1234
    
  </footer>

  <button id="topbtn" aria-label="Scroll to top" title="Back to top">↑</button>

  <div id="sv" role="dialog" aria-modal="true" aria-label="Search">
    <div id="sb">
      <input id="si" placeholder="Search books, authors, topics…" autocomplete="off">
      <ul id="sr"></ul>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
